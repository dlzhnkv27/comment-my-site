<!doctype html>
<!-- Plain test page (no mocks) for running the real extension in a throwaway Chrome profile. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>E2E test page</title>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 17px/1.6 Georgia, serif; color: #1d1d1f; }
  .top { position: fixed; inset: 0 0 auto 0; height: 60px; background: rgba(20,20,30,.92); color: #fff;
         display: flex; align-items: center; gap: 24px; padding: 0 32px; z-index: 50; font: 600 15px system-ui; }
  .hero { height: 100vh; background: linear-gradient(135deg, #ff7a59, #ffd36e); display: grid; place-items: center;
          font: 800 64px system-ui; color: #fff; }
  .subnav { position: sticky; top: 60px; background: #fff; border-bottom: 1px solid #ddd; padding: 12px 32px;
            font: 600 14px system-ui; z-index: 40; }
  section { padding: 80px 32px; min-height: 600px; }
  section:nth-of-type(2n) { background: #f2f5ff; }
  h2 { font: 700 36px system-ui; margin: 0 0 16px; }
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity .6s, transform .6s; }
  .reveal.on { opacity: 1; transform: none; }
  .card { display: inline-block; width: 260px; height: 160px; margin: 12px; border-radius: 16px; background: #4f7cff; }
  .chat { position: fixed; right: 24px; bottom: 24px; width: 60px; height: 60px; border-radius: 50%;
          background: #16a34a; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 60; }
  footer { background: #111; color: #aaa; padding: 48px 32px; font: 14px system-ui; }
</style>
</head>
<body>
<div class="top">LOGO <span>Продукт</span><span>Цены</span><span>Блог</span></div>
<div class="hero">Hero 100vh</div>
<div class="subnav">Sticky subnav · Раздел 1 · Раздел 2 · Раздел 3</div>
<section><h2>Раздел 1</h2><p>Обычный текст абзаца. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  <div class="card"></div><div class="card"></div><div class="card"></div></section>
<section><h2>Раздел 2 — появляется при прокрутке</h2><div class="reveal"><div class="card" style="background:#ff4f9a"></div><div class="card" style="background:#ff4f9a"></div></div></section>
<section><h2>Раздел 3</h2><p>Ещё текст.</p><div class="card" style="background:#00b386"></div></section>
<footer>Footer · © 2026</footer>
<div class="chat"></div>
<script>
  const io = new IntersectionObserver((entries) => entries.forEach((e) => e.isIntersecting && e.target.classList.add('on')));
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
</script>
</body>
</html>
